<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 앱 창(file://)은 이미지를 앱의 HTTP 서버에서 받고, OBS(http://)는 같은 서버에서 받는다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: http://127.0.0.1:*; connect-src 'self' ws: wss:" />
  <title>IIDXwidget Browser Source Page</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/dashFonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 무대: 본체(1P) + DP면 가운데 검정 여백과 2P 본체(1P 본체를 복제). 계기판·홍보 줄은 무대에 붙는다 -->
  <div class="stage">
  <div class="container" data-side="1">
    <!-- 디스크 전체 + 버튼 그리드 -->
    <div class="main-content">
      <div class="disc-wrapper">
        <!-- 디스크 관련 요소들 -->
        <div id="outline-ring">
          <div id="upper-indicator" class="ring-half"></div>
          <div id="lower-indicator" class="ring-half"></div>
        </div>
        <div id="disc">
          <img id="up-disc-image" class="disc-image" src="" alt=" " />
          <img id="down-disc-image" class="disc-image" src="" alt=" " />
          <div id="disc-needle"></div>
        </div>
      </div>

      <div class="button-grid">
        <!-- 키보드 입력 표시: 건반 위 빈 공간에 작게 (건반 배치에 영향 없음) -->
        <div class="kb-indicator"><span class="kb-dot"></span>INPUT · KB</div>
        <div class="button-row">
          <div class="key" id="button-2"><span class="release-label">99</span></div>
          <div class="key" id="button-4"><span class="release-label">99</span></div>
          <div class="key" id="button-6"><span class="release-label">99</span></div>
        </div>
        <div class="button-row">
          <div class="key" id="button-1"><span class="release-label">99</span></div>
          <div class="key" id="button-3"><span class="release-label">99</span></div>
          <div class="key" id="button-5"><span class="release-label">99</span></div>
          <div class="key" id="button-7"><span class="release-label">99</span></div>
        </div>
      </div>
    </div>
  </div> <!-- container 닫기 -->
  <div class="dp-gap" hidden></div>
  <!-- DP에서 키보드 입력 표시: 두 본체 사이 가운데 위 (어느 쪽이 키보드인지 표시) -->
  <div class="kb-indicator dp-kb-indicator"><span class="kb-dot"></span><span data-role="dp-kb-text">INPUT · KB</span></div>

    <!-- 계기판: 본체 아래(또는 위)에 붙는 세션 정보 패널. DP에서는 가운데에 사다리꼴로 붙는다 -->
    <div class="release-container">
      <div class="dash-cell dash-session"><span class="dash-label">Session</span><span class="dash-value" id="session-display">0</span></div>
      <div class="dash-cell dash-uptime"><span class="dash-label">Uptime</span><span class="dash-value" id="uptime-display">0:00:00</span></div>
      <div class="dash-cell dash-release"><span class="dash-label">Release</span><span class="dash-value"><span id="release-display">--</span><small>ms</small></span></div>
      <div class="dash-cell dash-kps">
        <!-- KPS 스피드미터 (설정에서 끌 수 있음). 모양은 index.js의 buildKpsGauge가 그린다 -->
        <svg class="kps-gauge" id="kps-gauge" viewBox="0 0 100 64" aria-hidden="true"></svg>
        <span class="dash-label">KPS</span><span class="dash-value" id="kps-display">0</span>
      </div>
    </div>

    <div id="promo-top" class="promo-box">Try this! → https://github.com/Coldlapse/IIDXwidget</div>
    <div id="promo-bottom" class="promo-box">Try this! → https://github.com/Coldlapse/IIDXwidget</div>
  </div> <!-- stage 닫기 -->

  <!-- OBS·브라우저에서 앱과의 연결이 끊기면 위젯 전체를 가리는 안내 -->
  <div id="connection-overlay" hidden>
    <div class="connection-box">
      <strong id="connection-title">위젯 프로그램과 연결이 끊겼습니다</strong>
      <span id="connection-detail">다시 연결하는 중...</span>
    </div>
  </div>


  <script src="../shared/imageUrl.js"></script>
  <script src="logic.js"></script>
  <script src="index.js"></script>
</body>


</html>
