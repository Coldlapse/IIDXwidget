<!DOCTYPE html>
<html lang="ko" data-overlay-scroll>
<head>
  <meta charset="UTF-8" />
  <!-- 미리보기 이미지는 앱의 HTTP 서버(127.0.0.1)에서 받는다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: http://127.0.0.1:*" />
  <title data-i18n="settings.title">설정</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/scrollbar.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <div class="settings-container">
    <div class="guide-row">
      <button type="button" class="guide-button" data-guide="USAGE" data-i18n="guide.usageButton">📘 사용법 가이드</button>
    </div>
    <div class="setting-group">
      <label class="section-label" data-i18n="settings.app">앱 기본 설정</label>
      <label><input type="checkbox" id="autoLaunch" /> <span data-i18n="settings.autoLaunch">Windows 시작 시 자동 실행</span></label>
    </div>

    <hr class="section-divider" />
    <label class="section-label" data-i18n="settings.controllers">컨트롤러</label>
    <div class="setting-group">
      <label for="buttonLayout" data-i18n="settings.buttonLayout">버튼 레이아웃</label>
      <select id="buttonLayout">
        <option value="1P">1P</option>
        <option value="2P">2P</option>
        <option value="DP" data-i18n="settings.layoutDP">DP (1P + 2P)</option>
      </select>
      <p class="mapping-help" id="dp-hint" data-i18n="settings.dpHint" hidden></p>
    </div>
    <!-- 사이드별 컨트롤러 (SP는 1개, DP는 1P·2P). 내용은 controller-side-template에서 만든다 -->
    <div class="controller-side" data-side="1"></div>
    <div class="controller-side" data-side="2" hidden></div>

    <hr class="section-divider" />
    <label class="section-label" data-i18n="settings.sectionAccount">beatmania.app</label>
    <div class="setting-group">
      <label for="apiToken" data-i18n="settings.account">beatmania.app 계정</label>
      <p id="account-status" class="account-status"></p>
      <div class="token-form">
        <input type="password" id="apiToken" autocomplete="off" spellcheck="false" placeholder="API 토큰 붙여 넣기" data-i18n-placeholder="settings.apiPlaceholder" />
        <button type="button" id="connect-token">연결</button>
      </div>
      <p id="token-message" class="token-message" aria-live="polite"></p>
      <p class="account-links">
        <a href="https://beatmania.app/account/token/" target="_blank" data-i18n="settings.viewTokenOnSite">사이트에서 토큰 보기</a>
        <span id="profile-link-group" hidden> · <a id="profile-link" href="#" target="_blank" data-i18n="settings.myProfile">내 서열표 ↗</a></span>
        <span id="disconnect-group" hidden> · <a href="#" id="disconnect-token" data-i18n="settings.disconnect">연결 해제</a></span>
      </p>
      <label><input type="checkbox" id="autoUploadOnQuit" /> <span data-i18n="settings.autoUploadOnQuit">종료할 때 남은 타건 기록 자동 전송</span></label>
      <p class="mapping-help" data-i18n="settings.autoUploadHint">beatmania.app 토큰이 있어야 동작합니다.</p>
    </div>

    <hr class="section-divider" />
    <label class="section-label" data-i18n="settings.sectionServer">서버 포트 설정</label>
    <div class="setting-group">
      <label for="serverPort" data-i18n="settings.serverPort">서버 포트</label>
      <input type="number" id="serverPort" min="1024" max="65535" />
    </div>
    <div class="setting-group">
      <label for="webSocketPort" data-i18n="settings.websocketPort">웹소켓 포트</label>
      <input type="number" id="webSocketPort" min="1024" max="65535" />
      <button type="button" class="guide-button" data-guide="CONNECTION" data-i18n="guide.connectionButton">🔌 연결 가이드 (원컴/투컴 주소, IP 찾는 법)</button>
    </div>

    <hr class="section-divider" />
    <label class="section-label" data-i18n="settings.inputAnalysis">Release 표본 수집 기준</label>
    <div class="setting-group">
      <label for="GlobalReleaseMALength" data-i18n="settings.globalMA">전체 Release 수집 표본 갯수 (기본 2000, 수치가 높을수록 변화에 둔감)</label>
      <input type="number" id="GlobalReleaseMALength" min="10" max="5000" step="1" value="2000" />
    </div>

    <div class="setting-group">
      <label for="PerButtonMALength" data-i18n="settings.perButtonMA">버튼별 Release 수집 표본 갯수 (기본 300, 수치가 높을수록 변화에 둔감)</label>
      <input type="number" id="PerButtonMALength" min="10" max="5000" step="1" value="300" />
    </div>

    <div class="setting-group">
      <label for="cnThresholdMs" data-i18n="settings.cnThreshold">롱노트(CN) 판정 시간 (ms, 기본 200)</label>
      <input type="number" id="cnThresholdMs" min="100" max="500" step="1" value="200" />
      <p class="mapping-help" data-i18n="settings.cnThresholdHint"></p>
    </div>

    <div class="setting-group">
      <button type="button" class="guide-button" id="open-chatter-settings" data-i18n="settings.chatterSettingsLink">채터링 감지 설정 열기 →</button>
    </div>
    <hr class="section-divider" />
    <label class="section-label" data-i18n="settings.appearance">위젯 외관 커스터마이징</label>
    <div class="setting-group">
      <label><input type="checkbox" id="transparent-container" /> <span data-i18n="settings.transparentContainer">위젯 컨테이너 배경 투명하게</span></label>
      <label><input type="checkbox" id="showKeyRelease" /> <span data-i18n="settings.showKeyRelease">각 버튼 위에 버튼별 Release 수치 표시</span></label>
    </div>
    <div class="setting-group">
      <label for="infoPosition" data-i18n="settings.infoPosition">세션 정보 표시 위치</label>
      <select id="infoPosition">
        <option value="top" data-i18n="settings.top">상단</option><option value="bottom" data-i18n="settings.bottom">하단</option><option value="none" data-i18n="settings.none">없음</option>
      </select>
    </div>
    <div class="setting-group">
      <!-- 설명은 마우스를 올리면 보인다 (data-i18n-title) -->
      <label class="has-tooltip" data-i18n-title="settings.promoHint"><input type="checkbox" id="showPromoBox" /> <span data-i18n="settings.promo">위젯 홍보 박스 표시</span> <span class="tooltip-mark" aria-hidden="true">ⓘ</span></label>
    </div>
    <div class="setting-group">
      <label><input type="checkbox" id="kpsGaugeEnabled" /> <span data-i18n="settings.kpsGauge">KPS 스피드미터 게이지 표시</span></label>
      <select id="kpsGaugePreset">
        <option value="iidx" data-i18n="settings.kpsGaugeIidx">IIDX 유저 (빨간 영역 20 KPS부터, 최대 40)</option>
        <option value="bms" data-i18n="settings.kpsGaugeBms">BMS 유저 ~★★ (빨간 영역 30 KPS부터, 최대 50)</option>
        <option value="bmsInsane" data-i18n="settings.kpsGaugeBmsInsane">BMS 유저 ★★~ (빨간 영역 40 KPS부터, 최대 60)</option>
      </select>
      <p class="mapping-help" data-i18n="settings.kpsGaugeHint">계기판의 KPS를 자동차 속도계처럼 보여줍니다. 빨간 영역에 들어가면 점점 달아오릅니다.</p>
    </div>
    <div class="setting-group">
      <label for="discImageMode" data-i18n="settings.discImageMode">스크래치 이미지 모드</label>
      <select id="discImageMode">
        <option value="single" data-i18n="settings.discImageSingle">1장</option>
        <option value="dual" data-i18n="settings.discImageDual">2장 (회전 방향에 따라 변경)</option>
      </select>
    </div>
    <div class="setting-group">
      <label id="up-disc-label">스크래치 커스텀 이미지 업로드</label>
      <div class="input-with-delete">
        <button type="button" id="pick-up-disc-button" data-i18n="settings.pickImage">이미지 선택</button>
        <button type="button" id="delete-up-disc-button" data-i18n="settings.delete">삭제</button>
      </div>
      <img id="up-disc-preview" class="disc-preview" alt="" />
    </div>
    <div class="setting-group" id="down-disc-group" style="display: none;">
      <label data-i18n="settings.discImageDown">아랫방향 스크래치 커스텀 이미지 업로드</label>
      <div class="input-with-delete">
        <button type="button" id="pick-down-disc-button" data-i18n="settings.pickImage">이미지 선택</button>
        <button type="button" id="delete-down-disc-button" data-i18n="settings.delete">삭제</button>
      </div>
      <img id="down-disc-preview" class="disc-preview" alt="" />
    </div>
    <div class="setting-group" id="auto-palette-group" hidden>
      <label><input type="checkbox" id="autoPalette" /> <span data-i18n="settings.autoPalette">이 이미지에 어울리는 추천 색상 사용</span></label>
      <p class="mapping-help" data-i18n="settings.autoPaletteHint"></p>
      <p class="mapping-help" id="auto-palette-status" hidden></p>
    </div>
    <div class="setting-group">
      <div class="color-setting-row">
        <label for="color-container-background" data-i18n="settings.containerBackground">위젯 컨테이너 배경색</label>
        <input type="color" id="color-container-background" />
        <span class="color-preview" id="preview-container-background"></span>
      </div>
      <div class="color-setting-row">
        <label for="color-background" data-i18n="settings.background">스크래치 배경색</label>
        <input type="color" id="color-background" />
        <span class="color-preview" id="preview-background"></span>
      </div>
      <div class="color-setting-row">
        <label for="color-accent" data-i18n="settings.accent">버튼/스크래치 입력 전 색상</label>
        <input type="color" id="color-accent" />
        <span class="color-preview" id="preview-accent"></span>
      </div>
      <div class="color-setting-row">
        <label for="color-activeColor" data-i18n="settings.active">버튼/스크래치 입력 시 색상</label>
        <input type="color" id="color-activeColor" />
        <span class="color-preview" id="preview-activeColor"></span>
      </div>
      <div class="color-setting-row">
        <label for="color-fontColor" data-i18n="settings.font">폰트/스크래치 가로선 색상</label>
        <input type="color" id="color-fontColor" />
        <span class="color-preview" id="preview-fontColor"></span>
      </div>
      <div class="color-setting-row">
        <label for="color-lnColor" data-i18n="settings.ln">롱노트(CN)로 누르고 있는 건반 색상</label>
        <input type="color" id="color-lnColor" />
        <span class="color-preview" id="preview-lnColor"></span>
      </div>
    </div>

    <!-- 저장 줄: 스크롤 중에는 창 아래에 떠 있고, 맨 아래까지 내리면 제자리(설정 박스 끝)에 붙는다 -->
    <div class="save-bar" id="save-bar">
      <div id="form-status" role="alert"></div>
      <div class="button-row">
        <button id="save-button" data-i18n="settings.save">저장</button><button id="cancel-button" data-i18n="settings.cancel">저장하지 않고 종료</button>
      </div>
    </div>
    <div id="save-bar-anchor" aria-hidden="true"></div>
  </div>

  <!-- 사이드 하나의 컨트롤러 설정 (프로필, 장치, LR2, 키보드 매핑, 기타 컨트롤러 매핑) -->
  <template id="controller-side-template">
    <div class="setting-group">
      <label class="side-title" data-role="title" hidden></label>
      <label data-i18n="settings.controllerProfile">컨트롤러 프로필</label>
      <select data-role="profile">
        <option value="AUTO" data-i18n="settings.auto">기타 컨트롤러 (수동 매핑)</option>
        <option value="PHOENIXWAN">PHOENIXWAN+</option>
        <option value="PHOENIXWAN LMT Classic">PHOENIXWAN+ LMT Classic</option>
        <option value="ARCIN">arcin-infinitas</option>
        <option value="FPS EMP Gen2">FPS EMP Gen2</option>
        <option value="KB" data-i18n="settings.keyboard">BM으로 하라고 만든 게임을 꾸역꾸역 키보드로 하는 멍청이</option>
      </select>
      <div class="device-row" data-role="device-row">
        <label data-i18n="settings.device">장치</label>
        <div class="device-select">
          <select data-role="device"></select>
          <button type="button" class="guide-button" data-role="refresh" data-i18n="settings.refreshDevices">다시 찾기</button>
        </div>
      </div>
      <label data-role="lr2-row" class="has-tooltip" data-i18n-title="settings.lr2Hint"><input type="checkbox" data-role="lr2" /> <span data-i18n="settings.lr2">LR2 모드 감지 (주작콘 전용)</span> <span class="tooltip-mark" aria-hidden="true">ⓘ</span></label>
      <div class="reverse-row" data-role="reverse-row">
        <label><input type="checkbox" data-role="tt-reverse" /> <span data-i18n="settings.turntableReverse">턴테이블 방향 반전</span></label>
        <div class="tt-preview idle" data-role="tt-preview" aria-hidden="true"><div class="tt-needle" data-role="tt-disc"></div></div>
      </div>
      <p class="mapping-help" data-role="reverse-help"></p>
    </div>

    <div class="setting-group" data-role="kb-container" hidden>
      <label data-i18n="settings.keyboardMapping">키보드 매핑 (저는 KB를 하는 바보입니다)</label>
      <table class="key-mapping-table">
        <tr><td>SCup</td><td><input type="text" data-key="SCup" readonly /></td></tr>
        <tr><td>SCdown</td><td><input type="text" data-key="SCdown" readonly /></td></tr>
        <tr><td>1</td><td><input type="text" data-key="1" readonly /></td></tr>
        <tr><td>2</td><td><input type="text" data-key="2" readonly /></td></tr>
        <tr><td>3</td><td><input type="text" data-key="3" readonly /></td></tr>
        <tr><td>4</td><td><input type="text" data-key="4" readonly /></td></tr>
        <tr><td>5</td><td><input type="text" data-key="5" readonly /></td></tr>
        <tr><td>6</td><td><input type="text" data-key="6" readonly /></td></tr>
        <tr><td>7</td><td><input type="text" data-key="7" readonly /></td></tr>
      </table>
    </div>

    <div class="setting-group" data-role="generic-container" hidden>
      <label data-i18n="settings.genericMapping">기타 컨트롤러 버튼 매핑</label>
      <p class="mapping-help" data-i18n="settings.genericHelp">각 칸을 클릭한 다음 원하는 컨트롤러 버튼을 누르세요. 칸을 비우면 매핑이 해제됩니다. 마지막에 저장을 누르세요.</p>
      <table class="generic-mapping-table">
        <tbody>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="1"></td></tr>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="2"></td></tr>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="3"></td></tr>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="4"></td></tr>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="5"></td></tr>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="6"></td></tr>
          <tr><td></td><td><input type="number" min="1" max="64" data-key="7"></td></tr>
        </tbody>
      </table>
      <!-- 턴테이블: 버튼 턴테이블 ↔ 아날로그 턴테이블 중 하나만 쓴다. 쓰지 않는 쪽 값도 지우지 않고 그대로 저장한다 -->
      <div class="tt-mode-row">
        <span class="tt-mode-name" data-role="tt-mode-button" data-i18n="settings.buttonTurntable">버튼 턴테이블</span>
        <label class="switch"><input type="checkbox" data-role="tt-mode" /><span class="switch-track"></span></label>
        <span class="tt-mode-name" data-role="tt-mode-analog" data-i18n="settings.analogTurntable">아날로그 턴테이블</span>
      </div>
      <div data-role="tt-button-section">
        <table class="generic-mapping-table">
          <tbody>
            <tr><td></td><td><input type="number" min="1" max="64" data-key="SCup"></td></tr>
            <tr><td></td><td><input type="number" min="1" max="64" data-key="SCdown"></td></tr>
          </tbody>
        </table>
        <label class="legacy-row"><input type="checkbox" data-role="tt-legacy" /> <span data-i18n="settings.buttonTurntableLegacy">Button Turntable legacy</span></label>
        <p class="mapping-help" data-role="legacy-help"></p>
      </div>
      <div data-role="tt-analog-section" hidden>
        <div class="axis-row">
          <span data-i18n="settings.turntableAxis">턴테이블 (축)</span>
          <span class="axis-value" data-role="axis-value"></span>
          <button type="button" data-role="learn-axis" data-i18n="settings.learnAxis">학습</button>
          <button type="button" data-role="clear-axis" data-i18n="settings.clearAxis">할당 해제</button>
        </div>
        <p class="mapping-help" data-role="axis-help" data-i18n="settings.axisHelp">턴테이블이 축으로 동작하는 기판이라면 '학습'을 누르고 2초 동안 턴테이블을 돌리세요.</p>
      </div>
      <div class="mapping-status" data-role="mapping-status" aria-live="polite"></div>
    </div>
  </template>

  <script src="../shared/overlayScroll.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/imageUrl.js"></script>
  <script src="../shared/palette.js"></script>
  <script src="formLogic.js"></script>
  <script src="controllerPanel.js"></script>
  <script src="settings.js"></script>
</body>
</html>
