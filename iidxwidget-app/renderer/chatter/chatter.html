<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
  <title data-i18n="chatter.title">채터링 감지기</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/window.css" />
  <link rel="stylesheet" href="chatter.css" />
</head>
<body>
  <section class="panel">
    <h2 data-i18n="chatter.title">채터링 감지기</h2>
    <p class="muted note" data-i18n="chatter.description">떼는 시간이 15ms 이하인 입력을 이중 인식(채터링)으로 셉니다. 이번 세션 기준이며, 이 창을 닫아 두어도 계속 집계합니다.</p>

    <!-- IIDX 건반 배치: 위 2·4·6(검은 건반), 아래 1·3·5·7(흰 건반). 숫자는 건반 위에 표시 -->
    <div class="keyboard">
      <div class="key-row black">
        <div class="key-slot" data-button="2"><span class="count">0</span><div class="key">2</div></div>
        <div class="key-slot" data-button="4"><span class="count">0</span><div class="key">4</div></div>
        <div class="key-slot" data-button="6"><span class="count">0</span><div class="key">6</div></div>
      </div>
      <div class="key-row white">
        <div class="key-slot" data-button="1"><span class="count">0</span><div class="key">1</div></div>
        <div class="key-slot" data-button="3"><span class="count">0</span><div class="key">3</div></div>
        <div class="key-slot" data-button="5"><span class="count">0</span><div class="key">5</div></div>
        <div class="key-slot" data-button="7"><span class="count">0</span><div class="key">7</div></div>
      </div>
    </div>

    <div class="total">
      <span data-i18n="chatter.total">합계</span>
      <strong id="total">0</strong>
    </div>

    <div class="guide-link">
      <button type="button" id="open-guide" class="guide-button" data-i18n="guide.chatterButton">❓ 채터링 감지 가이드</button>
    </div>
  </section>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/fitWindow.js"></script>
  <script src="chatter.js"></script>
</body>
</html>
