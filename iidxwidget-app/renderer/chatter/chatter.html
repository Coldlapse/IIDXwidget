<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
  <title data-i18n="chatter.title">채터링 감지기</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/window.css" />
  <link rel="stylesheet" href="chatter.css" />
</head>
<body>
  <section class="panel" id="main-view">
    <div class="panel-head">
      <h2 data-i18n="chatter.title">채터링 감지기</h2>
      <button type="button" id="open-settings" class="icon-button" data-i18n="chatter.settings">⚙ 설정</button>
    </div>
    <!-- 설명은 지금 기준(프리셋, ms)에 맞춰 chatter.js가 채운다 -->
    <p class="muted note" id="description"></p>

    <!-- IIDX 건반 배치: 위 2·4·6(검은 건반), 아래 1·3·5·7(흰 건반). 숫자는 건반 위에 표시.
         두 그룹은 뒷배경 글로우로 묶고(흰 건반 흰색, 검은 건반 파란색), 그룹 평균의 2배 이상인 건반만 강조한다 -->
    <div class="side-label" data-side-label hidden>1P</div>
    <div class="keyboard" data-keyboard="1">
      <div class="key-row black">
        <div class="key-slot" data-button="2"><span class="count">0</span><div class="key">2</div></div>
        <div class="key-slot" data-button="4"><span class="count">0</span><div class="key">4</div></div>
        <div class="key-slot" data-button="6"><span class="count">0</span><div class="key">6</div></div>
      </div>
      <div class="key-row white">
        <div class="key-slot" data-button="1"><span class="count">0</span><div class="key">1</div></div>
        <div class="key-slot" data-button="3"><span class="count">0</span><div class="key">3</div></div>
        <div class="key-slot" data-button="5"><span class="count">0</span><div class="key">5</div></div>
        <div class="key-slot" data-button="7"><span class="count">0</span><div class="key">7</div></div>
      </div>
    </div>

    <p class="muted legend" data-i18n="chatter.outlierLegend"></p>

    <div class="guide-link">
      <button type="button" class="guide-button" data-open-guide data-i18n="guide.chatterButton">❓ 채터링 감지 가이드</button>
    </div>
  </section>

  <!-- 채터링 감지 설정. 저장하면 이번 세션 기록을 새 기준으로 바로 다시 센다 (재시작 필요 없음) -->
  <section class="panel" id="settings-view" hidden>
    <h2 data-i18n="chatter.settingsTitle">채터링 감지 설정</h2>

    <div class="field-label" data-i18n="chatter.preset">감지 방식</div>
    <label class="preset">
      <input type="radio" name="preset" value="rag" />
      <span><strong>Rag</strong> <span class="muted" data-i18n="chatter.presetRagHint"></span></span>
    </label>
    <label class="preset">
      <input type="radio" name="preset" value="sadang" />
      <span><strong>Coldlapse</strong> <span class="muted" data-i18n="chatter.presetSadangHint"></span></span>
    </label>

    <div class="ms-row">
      <label for="upperMs" data-i18n="chatter.upperMs">감지 기준 (ms)</label>
      <input type="number" id="upperMs" min="1" max="100" step="1" />
    </div>
    <div class="ms-row" id="lower-row">
      <label for="lowerMs" data-i18n="chatter.lowerMs">하한 (ms)</label>
      <input type="number" id="lowerMs" min="1" max="100" step="1" />
    </div>
    <p class="muted rule" id="rule"></p>

    <p id="settings-status" class="settings-status" aria-live="polite"></p>
    <div class="settings-buttons">
      <button type="button" class="guide-button" data-open-guide data-i18n="guide.chatterButton">❓ 채터링 감지 가이드</button>
      <span class="spacer"></span>
      <button type="button" id="back-button" class="guide-button" data-i18n="chatter.back">돌아가기</button>
      <button type="button" id="save-button" class="save-button" data-i18n="chatter.save">저장</button>
    </div>
  </section>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/fitWindow.js"></script>
  <script src="chatterLogic.js"></script>
  <script src="chatter.js"></script>
</body>
</html>
