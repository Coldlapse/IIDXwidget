name: 기능 요청 / Feature request
description: 새 기능이나 바꿨으면 하는 점을 제안해 주세요. / Suggest a new feature or a change.
title: "[기능] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        요청한다고 해서 꼭 만들어지지는 않습니다. 위젯 레이아웃(OBS 800×600 기준)처럼 기존 사용자의 화면이 바뀌는 변경은 신중하게 검토합니다.
        A request doesn't guarantee it will be built. Changes that would alter existing users' screens, such as the widget layout (800×600 OBS source), are considered carefully.
  - type: textarea
    id: idea
    attributes:
      label: 원하는 기능 / What you'd like
      description: 무엇이 어떻게 됐으면 하는지 적어 주세요. / Describe what you want and how it should work.
      placeholder: "예 / e.g. 위젯 색 설정을 파일로 내보내고 가져오기"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 필요한 이유 / Why
      description: 언제, 어떤 상황에서 쓰고 싶은지. 지금은 어떻게 하고 계신지도 적어 주세요. / When and why you'd use it, and how you handle it today.
      placeholder: "예 / e.g. PC를 바꿀 때마다 색을 하나씩 다시 맞추고 있음"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법 / Alternatives
      description: 다른 방식이 있다면 적어 주세요. / Other ways it could work, if any.
  - type: textarea
    id: attachments
    attributes:
      label: 그림·예시 / Mockups, examples
      description: 스케치나 다른 프로그램의 예시가 있으면 끌어다 놓아 첨부해 주세요. / Drag in sketches or examples from other tools, if you have any.
